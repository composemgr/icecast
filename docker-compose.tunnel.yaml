name: icecast
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

x-ices0: &ices-environment
  STREAM_VERBOSE: 1
  STREAM_PRIVATE: 0
  STREAM_RANDOMIZE: 0
  STREAM_BITRATE: 320
  STREAM_CROSSFADE: 2
  STREAM_REENCODED: 0
  STREAM_BACKGROUND: 0
  STREAM_PLAYLIST_TYPE: builtin
  STREAM_INTERPRETER_MODULE: ices
  STREAM_REENCODED_CHANNELS: 2
  STREAM_REENCODED_SAMPLERATE: 44100
  STREAM_MEDIA_FOLDER: /media
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

x-environment: &default-environment
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  LANGUAGE: C.UTF-8
  STREAM_PORT: 8000
  STREAM_HOST: server
  STREAM_PROTOCOL: http
  TZ: ${TZ:-America/New_York}
  ICECAST_HOSTNAME: ${BASE_HOST_NAME:-localhost}
  STREAM_PASSWORD: ${APP_SECRET_KEY:-changeme_stream_password}
  ICECAST_RELAY_PASSWORD: ${APP_SECRET_KEY:-changeme_stream_password}
  ICECAST_SOURCE_PASSWORD: ${APP_SECRET_KEY:-changeme_stream_password}

services:
  server:
    image: ghcr.io/binmgr/icecast:latest
    container_name: icecast-server
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      <<: *default-environment
      ICECAST_MAX_CLIENTS: 9999999999
      ICECAST_MAX_SOURCES: 9999999999
      ICECAST_LOCATION: ${ICECAST_LOCATION:-USA}
      ICECAST_ADMIN_USERNAME: ${APP_ADMIN_USER:-admin}
      ICECAST_ADMIN_EMAIL: ${APP_ADMIN_USER:-admin}@${BASE_DOMAIN_NAME:-${BASE_HOST_NAME:-localhost}}
      ICECAST_ADMIN_PASSWORD: ${APP_ADMIN_PASS:-changeme_admin_password}
      CONTAINER_NAME: icecast-server
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD-SHELL', 'wget -S -O /dev/null http://127.0.0.1:8000/ 2>&1 | grep -q "HTTP/" || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://icecast-server:8000'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - icecast
      - cloudflare
  music:
    image: ghcr.io/binmgr/ices0:latest
    container_name: icecast-music
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: music
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      <<: [*default-environment, *ices-environment]
      STREAM_MOUNTPOINT: /music
      STREAM_NAME: Music
      STREAM_GENRE: Various
      STREAM_DESCRIPTION: ${APP_ORG_NAME:-MyOrg} Music
      STREAM_URL: https://${ICECAST_HOSTNAME:-${BASE_HOST_NAME:-localhost}}/music
      CONTAINER_NAME: icecast-music
    volumes:
      - './volumes/config/music:/config/ices0:z'
      - './volumes/data/music:/data/ices0:z'
      - '/mnt/Music/Mp3:/media:ro'
    healthcheck:
      test: ['CMD-SHELL', 'pgrep ices0 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      server:
        condition: service_healthy
    networks:
      - icecast

  nightcore:
    image: ghcr.io/binmgr/ices0:latest
    container_name: icecast-nightcore
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: nightcore
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      <<: [*default-environment, *ices-environment]
      STREAM_MOUNTPOINT: /nightcore
      STREAM_NAME: NightCore
      STREAM_GENRE: NightCore
      STREAM_DESCRIPTION: ${APP_ORG_NAME:-MyOrg} nightcore
      STREAM_URL: https://${ICECAST_HOSTNAME:-${BASE_HOST_NAME:-localhost}}/nightcore
      CONTAINER_NAME: icecast-nightcore
    volumes:
      - './volumes/config/nightcore:/config/ices0:z'
      - './volumes/data/nightcore:/data/ices0:z'
      - '/mnt/Music/Nightcore:/media:ro'
    healthcheck:
      test: ['CMD-SHELL', 'pgrep ices0 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      server:
        condition: service_healthy
    networks:
      - icecast

networks:
  icecast:
    name: icecast
    external: false
  cloudflare:
    external: true
